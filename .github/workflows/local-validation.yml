name: IntegrateCore runner-only validation
on:
  push:
    branches: [ci/integratecore-local-validation-20261126]
permissions: {}
jobs:
  validate:
    if: github.repository == 'IntegrateCore/invoiceninja-ui' && github.event_name == 'push' && github.ref == 'refs/heads/ci/integratecore-local-validation-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: bcmath, gd, imagick, intl, mbstring, pdo_mysql, soap, zip
          tools: composer:v2
          coverage: none
      - name: Build, test and smoke the local image
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 022
          validation=$(mktemp -d "$RUNNER_TEMP/invoice-validation.XXXXXX")
          trap 'rm -rf "$validation"' EXIT
          public=https://raw.githubusercontent.com/IntegrateCore/invoiceninja/c64b9118385603d93f9c640fde0a9fcaaed73e8b/scripts/integratecore-release
          for script in candidate.sh common.sh test-candidate.sh; do
            curl -q -fsS --retry 3 --max-time 30 "$public/$script" -o "$validation/$script"
          done
          # PHP 8.4.27 bundles zip 1.22.8, which has its own version scheme.
          sed -i 's/"pdo_mysql","zip"/"pdo_mysql"/; s/!extension_loaded("imagick")/!extension_loaded("zip") || phpversion("zip") !== "1.22.8" || !class_exists("ZipArchive") || !extension_loaded("imagick")/' "$validation/common.sh"
          cat > "$validation/local.sh" <<'LOCAL'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          script_dir=$1
          source "$script_dir/common.sh"
          backend=173ff5a8362e49956b1bdb59197b286aa449e1c8
          ui=98090aa2595fddca5d1e8433c4436d1292245ec7
          stage=build
          build_candidate() {
            if docker build --progress=plain "$@"; then return 0; fi
            printf "Local build failed once; retrying unchanged inputs on the same runner\n" >&3
            sleep 15
            docker build --progress=plain "$@"
          }
          trap 'printf "%s: failed\n" "$stage" >&3' ERR
          LOCAL
          awk '/^work=\$\(mktemp/{keep=1} /^# Keep test dependencies/{keep=0} keep' "$validation/candidate.sh" |
            sed 's|^candidate=.*|candidate="invoiceninja:validation-$run_id"|' |
            awk '/^checkout / {print "stage=checkout"} /^composer install / {print "stage=backend-assets"} /^\( *$/ {print "stage=ui-assets"} /^docker build / {print "stage=image-build"; sub(/^docker build /, "build_candidate ")} /^php_parent=/ {print "stage=php-lineage"} /^verify_labels / {print "stage=image-labels"} /^verify_runtime / {print "stage=runtime-checks"} {print}' >> "$validation/local.sh"
          cat >> "$validation/local.sh" <<'LOCAL'
          printf "Pinned backend and UI, local image build, PHP lineage and runtime: passed\n" >&3
          stage="disposable test database setup"
          LOCAL
          awk '/^docker network create --internal/{keep=1} /^start_db$/{keep=0} keep' "$validation/candidate.sh" >> "$validation/local.sh"
          cat >> "$validation/local.sh" <<'LOCAL'
          start_db
          stage="test dependency installation"
          docker run -d --network bridge --name "$test_app" --entrypoint sleep "$candidate" infinity
          docker exec "$test_app" composer install --no-interaction --no-progress --prefer-dist --no-scripts
          docker network connect "$network" "$test_app"
          docker network disconnect bridge "$test_app"
          stage="PR #12 test gate"
          gate=0
          docker exec -i "${app_env[@]}" -e APP_ENV=testing "$test_app" bash -se \
            < "$script_dir/test-candidate.sh" > "$script_dir/gate.log" 2>&1 || gate=$?
          sed -E 's/\x1b\[[0-9;]*m//g' "$script_dir/gate.log" |
            awk '/^OK \([0-9]+ tests?, [0-9]+ assertions?\)$/ {print "PHPUnit: " $0}' >&3
          if (( gate == 0 )); then
            printf "PR #12 full test selection: passed\n" >&3
          else
            printf "PR #12 full test selection: failed (exit %d)\n" "$gate" >&3
            awk '/^Tests: [0-9]+, Assertions: [0-9]+(, (Errors|Failures|Skipped|Warnings): [0-9]+)*\.$/ { print }' "$script_dir/gate.log" >&3
          fi
          stage="fresh smoke database setup"
          docker rm -fv "$test_app" "$database"
          start_db
          db_tables=$(docker exec "$database" sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -h127.0.0.1 -uroot -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE()" ninja')
          [[ "$db_tables" == 0 ]]
          printf "Smoke MySQL schema starts empty\n" >&3
          stage="normal entrypoint boot"
          docker run -d --network "$network" "${app_env[@]}" --name "$smoke" -e APP_ENV=production "$candidate"
          health=0
          if wait_health "$smoke"; then
            printf "Normal entrypoint HTTP /health: ready (status=ok)\n" >&3
          else
            health=1
            printf "Normal entrypoint HTTP /health: not ready\n" >&3
          fi
          migrations=0
          if migrations_ready "$smoke"; then
            printf "Fresh MySQL migrations: complete (no pending migrations)\n" >&3
          else
            migrations=1
            printf "Fresh MySQL migrations: not verified complete\n" >&3
          fi
          (( gate == 0 && health == 0 && migrations == 0 )) || exit 1
          LOCAL
          bash -n "$validation/local.sh"
          if bash "$validation/local.sh" "$validation" 3>&1 > "$validation/run.log" 2>&1; then
            exit 0
          else
            result=$?
          fi
          # Only fixed diagnostic labels and numeric Dockerfile locations leave the runner.
          for category in 'storage:no space left|disk quota' 'pecl-no-release:no releases available' 'pecl-http-denied:HTTP[^ ]* 403|403 Forbidden' 'build-executor-denied:failed to solve.*permission denied|operation not permitted' 'build-executor-exit-137:exit code: 137' 'imagick-install:install-php-extensions imagick.*exit code:' 'network:timed out|connection reset|temporary failure resolving|TLS handshake|502 Bad Gateway|503 Service Unavailable' 'apt:unable to locate package|failed to fetch|packages have unmet dependencies|exit code: 100' 'php-extension:PECL|No releases available|Cannot find config.m4|make: .*Error' 'composer:requirements could not be resolved|failed to download|lock file is not compatible' 'permission:permission denied|unauthorized|too many requests'; do
            label=$(cut -d: -f1 <<< "$category")
            pattern=$(cut -d: -f2- <<< "$category")
            if grep -Eiq "$pattern" "$validation/run.log"; then
              printf 'Diagnostic category: %s\n' "$label"
            fi
          done
          sed -nE 's/^.*Dockerfile:([0-9]+).*$/Dockerfile failure line: \1/p' "$validation/run.log" | sort -u
          grep -Eo '(^| )(app|php-runtime) [0-9]+/[0-9]+|exporting to image|naming to docker.io/library/invoiceninja|writing image|ERROR: failed to solve|ERROR: failed to update|ERROR: failed to write|ERROR: failed to build|permission denied|operation not permitted|failed to create|failed to remove|failed to read|failed to open' "$validation/run.log" | tail -32 || true
          exit "$result"
