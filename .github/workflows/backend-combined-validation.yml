name: Isolated combined image validation
on:
  push:
    branches: [ci/backend-combined-validation-20261126]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: IntegrateCore/invoiceninja
          ref: 7f4db47c4a1ad67370f23213aa66885b84197744
          persist-credentials: false
          sparse-checkout: .github/validation/combined-image.sh
          sparse-checkout-cone-mode: false
          path: validation-wrapper
      - uses: actions/checkout@v4
        with:
          repository: IntegrateCore/invoiceninja
          ref: 173ff5a8362e49956b1bdb59197b286aa449e1c8
          persist-credentials: false
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, imagick, intl, mbstring, pdo_mysql, soap, zip
          tools: composer:v2
          coverage: none
      - name: Build and test without publishing or deploying
        working-directory: backend
        run: |
          test "$(git rev-parse HEAD)" = 173ff5a8362e49956b1bdb59197b286aa449e1c8
          bash ../validation-wrapper/.github/validation/combined-image.sh
